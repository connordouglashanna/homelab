[defaults]
inventory = inventory.yml

# Auto-discovery picks /usr/bin/python3 (3.14 on channa-homelab) correctly
interpreter_python = auto_silent

# Readable task output
result_format = yaml

# Timing per task to find slow steps
callbacks_enabled = ansible.posix.profile_tasks

retry_files_enabled = False

[ssh_connection]
# Fewer SSH round-trips per task. Safe on Ubuntu (no `requiretty` in sudoers).
pipelining = True
