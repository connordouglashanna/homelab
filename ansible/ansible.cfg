[defaults]
inventory = inventory.yml

# Don't warn about the target's Python interpreter; auto-discovery picks
# /usr/bin/python3 (3.14 on channa-homelab) correctly.
interpreter_python = auto_silent

# Readable task output. The old `yaml` stdout callback was removed in
# community.general 13.x; this is its replacement in ansible-core.
result_format = yaml

# Timing per task, so slow steps are obvious.
callbacks_enabled = ansible.posix.profile_tasks

retry_files_enabled = False

[ssh_connection]
# Fewer SSH round-trips per task. Safe on Ubuntu (no `requiretty` in sudoers).
pipelining = True
