# Managed by Ansible (ansible/tasks/network.yml). Do not edit on the host.
#
# Additive overlay. Netplan merges /etc/netplan/*.yaml in lexical order, so this
# adds addressing and route priorities on top of subiquity's
# 00-installer-config.yaml without restating the wifi PSK, which would otherwise
# have to live in this repo.
network:
  version: 2

  ethernets:
    eno2:
      # subiquity's file pins the interface name via match/set-name and nothing
      # else, so eno2 has had no DHCP client and no IPv4 address at all. Its
      # IPv6 comes from networkd accepting RAs, which needs no config.
      dhcp4: true

      # Route metric. Lower wins; wlo1 is 600, so the wire is preferred while both
      # links are up. 100 is the conventional ethernet value. See README.md#network.
      dhcp4-overrides:
        route-metric: 100

      # Never block boot waiting for carrier here.
      optional: true

  wifis:
    wlo1:
      # Restates the metric networkd already assigns wifi, so the ordering above
      # is explicit in one place rather than inherited from a default that could
      # change under us.
      dhcp4-overrides:
        route-metric: 600
      optional: true
