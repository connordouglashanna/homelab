---
# Application state lives under /srv, one directory per application, bound
# into containers via bind-backed named volumes.
#
# Rationale and the full convention: docs/adr/0001-bind-backed-named-volumes.md
# /srv is its own 75G LV so a runaway application cannot fill / and lock you
# out of a headless box.

- name: /srv exists with conservative ownership
  ansible.builtin.file:
    path: /srv
    state: directory
    owner: root
    group: root
    mode: "0755"

# Per-application directories. `srv_apps` is empty until the first service is
# deployed, so this loop is a no-op today.
#
# Ownership is by numeric UID/GID on purpose: these must match the UID the
# container process runs as, which generally does not correspond to any user
# in the host's /etc/passwd.
- name: Application state directories exist
  ansible.builtin.file:
    path: "/srv/{{ item.name }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('0750') }}"
  loop: "{{ srv_apps }}"
  loop_control:
    label: "{{ item.name }}"
