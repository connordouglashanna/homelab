---
# Application state lives under /srv, one directory per application
#
# Rationale and the full convention: docs/adr/0001-bind-backed-named-volumes.md

- name: /srv exists with conservative ownership
  ansible.builtin.file:
    path: /srv
    state: directory
    owner: root
    group: root
    mode: "0755"

# Per-application directories.
#
# Ownership is by numeric UID/GID which must match the UID for the container
# process. 
#
# Parents are created before children, so the list must be ordered.
- name: Application state directories exist
  ansible.builtin.file:
    path: "/srv/{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('0750') }}"
  loop: "{{ srv_apps }}"
  loop_control:
    label: "{{ item.path }}"
