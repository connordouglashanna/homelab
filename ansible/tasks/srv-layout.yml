---
# One directory per application under /srv, per ADR 0001.

- name: /srv exists with conservative ownership
  ansible.builtin.file:
    path: /srv
    state: directory
    owner: root
    group: root
    mode: "0755"

# Parents before children: the loop creates directories in list order.
- name: Application state directories exist
  ansible.builtin.file:
    path: "/srv/{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('0750') }}"
  loop: "{{ srv_apps }}"
  loop_control:
    label: "{{ item.path }}"
