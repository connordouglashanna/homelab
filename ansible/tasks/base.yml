---
# Baseline system identity and update posture.
#
# All of this already matches the server; these tasks exist to pin the values
# so drift shows up in `--check --diff` rather than going unnoticed.

- name: Hostname is set
  ansible.builtin.hostname:
    name: channa-homelab

- name: Timezone is UTC
  community.general.timezone:
    name: Etc/UTC

# Security updates apply automatically. This is why `live-restore` is worth
# considering in daemon.json later — an unattended docker-ce upgrade will
# bounce the daemon and stop every running container.
- name: Unattended upgrades installed
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Unattended upgrades enabled
  ansible.builtin.systemd_service:
    name: unattended-upgrades
    enabled: true
    state: started
