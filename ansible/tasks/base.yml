---
# Baseline system identity and update posture.
#
# This already matches the server; these tasks pin the values
# so drift shows up in `--check --diff`

- name: Hostname is set
  ansible.builtin.hostname:
    name: channa-homelab

- name: Timezone is UTC
  community.general.timezone:
    name: Etc/UTC

# Security updates apply automatically. 
# This motivates `live-restore` in daemon.json
- name: Unattended upgrades installed
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Unattended upgrades enabled
  ansible.builtin.systemd_service:
    name: unattended-upgrades
    enabled: true
    state: started
