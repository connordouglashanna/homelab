---
# Additive: community.general.ufw adds absent rules and never flushes the ruleset, so
# applying this playbook cannot remove an access path you rely on.
#
# UFW governs wlo1 only. Mesh traffic on wt0 is filtered by NetBird ACL policy, not here.

- name: UFW default policies
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }
    - { direction: routed, policy: deny }

- name: SSH over the NetBird mesh
  # Produces both the v4 and v6 entries, because IPV6=yes.
  community.general.ufw:
    rule: allow
    interface: wt0
    direction: in
    to_port: "22"
    proto: tcp

- name: UFW enabled
  community.general.ufw:
    state: enabled

# Deliberately not enabled: there is no LAN path into this box, which makes NetBird the
# only route to a headless machine. See ansible/README.md#host-unreachable.
#
# Uncommenting either rule restores a second, independent path, at the cost of exposing
# port 22 to a flat LAN shared with IoT devices.
#
# - name: SSH from the LAN
#   community.general.ufw:
#     rule: allow
#     from_ip: 192.168.12.0/24
#     to_port: "22"
#     proto: tcp
#
# Narrower alternative: link-local IPv6 only — unroutable off-segment, and independent of
# the rogue DHCP server on this LAN.
#
# - name: SSH over link-local IPv6 on the LAN interface
#   community.general.ufw:
#     rule: allow
#     interface: wlo1
#     direction: in
#     from_ip: fe80::/10
#     to_port: "22"
#     proto: tcp
