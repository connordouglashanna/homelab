---
# UFW rules, reconciled against `sudo ufw status numbered` on 2026-08-08.
#
# Live ruleset at time of writing — exactly two entries, both the same rule
# expressed for each address family:
#
#   [ 1] 22/tcp on wt0        ALLOW IN    Anywhere
#   [ 2] 22/tcp (v6) on wt0   ALLOW IN    Anywhere (v6)
#
# Defaults from /etc/default/ufw:
#   IPV6=yes                            MANAGE_BUILTINS=no
#   DEFAULT_INPUT_POLICY="DROP"         DEFAULT_OUTPUT_POLICY="ACCEPT"
#   DEFAULT_FORWARD_POLICY="DROP"       DEFAULT_APPLICATION_POLICY="SKIP"
#
# These tasks are ADDITIVE. community.general.ufw adds a rule when it is
# absent and does nothing when it is present; it never flushes the ruleset.
# So running this playbook cannot remove an access path you rely on.
#
# Note that UFW does not filter mesh traffic in the way the rules below might
# suggest. Verified empirically: a port with no UFW allow rule was reachable
# over wt0 until the NetBird ACL was corrected. The division of labour is
# wlo1 -> UFW, wt0 -> NetBird ACL policy.

- name: UFW default policies
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }
    - { direction: routed, policy: deny }

- name: SSH over the NetBird mesh
  # Produces both the v4 and v6 entries, because IPV6=yes.
  community.general.ufw:
    rule: allow
    interface: wt0
    direction: in
    to_port: "22"
    proto: tcp

- name: UFW enabled
  community.general.ufw:
    state: enabled

# ###########################################################################
# NOT ENABLED — a deliberate decision, not an oversight.
# ###########################################################################
#
# There is currently NO LAN path into this box. Verified from the desktop on
# 2026-08-08: 192.168.12.222 -> 192.168.12.204 is on one subnet with a direct
# route and a REACHABLE ARP entry, and TCP/22 is still dropped. `.local`
# resolves (avahi answers, giving 192.168.12.204) but the connection dies at
# the firewall. So `ssh homelab-lan` and `ssh connor@channa-homelab.local`
# both fail today.
#
# That makes the NetBird mesh the single path to a headless machine. If the
# NetBird agent fails, the cloud control plane is unreachable, or the account
# has a problem, access requires physically attaching a keyboard and monitor.
#
# Uncommenting either rule below restores a second, independent path. The
# tradeoff is that anything on the LAN — including IoT devices sharing this
# flat L2 segment — can then reach port 22 and attempt authentication. SSH is
# key-only with a passphrase-protected key and a single entry in
# authorized_keys, so the exposure is modest.
#
# - name: SSH from the LAN
#   community.general.ufw:
#     rule: allow
#     from_ip: 192.168.12.0/24
#     to_port: "22"
#     proto: tcp
#
# Narrower alternative: link-local IPv6 only. Unroutable off-segment, and
# immune to the rogue DHCP server on this LAN handing out a broken IPv4
# lease, since it does not depend on DHCP at all.
#
# - name: SSH over link-local IPv6 on the LAN interface
#   community.general.ufw:
#     rule: allow
#     interface: wlo1
#     direction: in
#     from_ip: fe80::/10
#     to_port: "22"
#     proto: tcp
