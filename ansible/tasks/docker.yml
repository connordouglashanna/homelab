---
# Docker CE from Docker's official apt repository

- name: Keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Docker apt signing key present
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: "{{ docker_apt_keyring }}"
    owner: root
    group: root
    mode: "0644"
    # A failed download shouldn't truncate a working keyring.
    force: false

# A literal file, not apt_repository/deb822_repository: those name the file themselves and
# would leave this docker.list in place as a duplicate entry.
- name: Docker apt repository configured
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.list
    # `>` not `>-`: the file on disk ends with a newline, and stripping it reports changed forever.
    content: >
      deb [arch={{ docker_apt_arch }} signed-by={{ docker_apt_keyring }}]
      https://download.docker.com/linux/ubuntu
      {{ ansible_facts.distribution_release }} stable

    owner: root
    group: root
    mode: "0644"
  register: docker_repo

- name: Refresh apt cache when the repository changed
  ansible.builtin.apt:
    update_cache: true
  when: docker_repo.changed

- name: Docker packages installed
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

# JSON has no comment syntax, so daemon.json's rationale lives here:
#   log-opts       bind at container-create time, so rotation was configured before the
#                  first container existed; it does not apply retroactively.
#   ip             defaults published ports to loopback. See compose/README.md#publishing-ports-and-bind_ip.
#   live-restore   containers survive the daemon bounce unattended-upgrades causes.
#                  Incompatible with swarm mode; toggling needs a full restart, not a reload.
#
# `data-root` is deliberately absent: /var/lib/docker is a mount point, so a failed mount
# surfaces as an error instead of silently redirecting the daemon onto the root LV.
- name: Docker daemon configuration
  ansible.builtin.copy:
    src: files/daemon.json
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    validate: dockerd --validate --config-file %s
  notify: Restart docker

- name: Docker services enabled and running
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - containerd
    - docker

- name: Docker administrator in the docker group
  ansible.builtin.user:
    name: "{{ docker_admin_user }}"
    groups: docker
    append: true
