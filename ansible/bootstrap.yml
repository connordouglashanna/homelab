---
# DESTRUCTIVE — rewrites /etc/fstab and formats logical volumes.
# See ansible/README.md#bootstrap.

- name: channa-homelab storage bootstrap
  hosts: homelab
  become: true
  gather_facts: true
  tags: [never, bootstrap]

  vars:
    vg: ubuntu-vg
    lvs:
      - { name: docker, size: 50g, label: docker, mount: /var/lib/docker }
      - { name: srv, size: 75g, label: srv, mount: /srv }

  tasks:
    - name: Logical volumes exist
      community.general.lvol:
        vg: "{{ vg }}"
        lv: "{{ item.name }}"
        size: "{{ item.size }}"
        shrink: false
        # Grows the filesystem together with the LV
        resizefs: true
      loop: "{{ lvs }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Filesystems exist
      community.general.filesystem:
        fstype: ext4
        dev: "/dev/{{ vg }}/{{ item.name }}"
        opts: "-L {{ item.label }}"
        # Refuse to reformat a device that already holds a filesystem.
        force: false
      loop: "{{ lvs }}"
      loop_control:
        label: "{{ item.name }}"

    # Default holds back 5% for root; 1% still leaves recovery headroom.
    - name: Reserved block percentage lowered to 1%
      ansible.builtin.command:
        cmd: "tune2fs -m 1 /dev/{{ vg }}/{{ item.name }}"
      loop: "{{ lvs }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: false

    # Mounts by LABEL, which survives a rebuild. Expect the installer's hand-written
    # UUID= lines in /etc/fstab to be replaced.
    - name: Mounted and recorded in fstab
      ansible.posix.mount:
        src: "LABEL={{ item.label }}"
        path: "{{ item.mount }}"
        fstype: ext4
        opts: defaults
        passno: "2"
        dump: "0"
        state: mounted
      loop: "{{ lvs }}"
      loop_control:
        label: "{{ item.name }}"
