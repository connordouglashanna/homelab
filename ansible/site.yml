---
# Desired state for channa-homelab.
#
# This playbook describes the server as it is *now*. Every task should report
# `ok` in check mode, with exactly one exception noted in tasks/docker.yml
# (docker group membership, which hasn't been applied yet).
#
# Verify before applying:
#     ansible-playbook site.yml --check --diff -K
#
# Apply:
#     ansible-playbook site.yml -K
#
# Storage (LVM, fstab) deliberately lives in bootstrap.yml, not here — see
# that file for why.

- name: channa-homelab
  hosts: homelab
  become: true
  gather_facts: true

  vars:
    # Account that administers Docker.
    docker_admin_user: connor

    # dpkg architecture. Not derivable from ansible_facts.architecture, which
    # reports x86_64 rather than Debian's amd64.
    docker_apt_arch: amd64
    docker_apt_keyring: /etc/apt/keyrings/docker.asc

    # Per-application state directories under /srv, following
    # docs/adr/0001-bind-backed-named-volumes.md. Each entry is one directory;
    # list parents before children.
    #
    # UIDs must match what the container process runs as — these are not host
    # users, they are the numeric IDs baked into the images.
    srv_apps:
      # Forgejo: USER_UID/USER_GID 1000 in compose/forgejo/compose.yml
      - { path: forgejo, owner: "1000", group: "1000", mode: "0750" }
      - { path: forgejo/data, owner: "1000", group: "1000", mode: "0750" }

      # Runner: the image's documented compose layout runs as 1001:1001
      - { path: forgejo-runner, owner: "1001", group: "1001", mode: "0750" }
      - { path: forgejo-runner/data, owner: "1001", group: "1001", mode: "0750" }
      # .cache needs group-write and setgid so job containers can share it
      - { path: forgejo-runner/data/.cache, owner: "1001", group: "1001", mode: "2775" }

  tasks:
    - name: Base system
      ansible.builtin.import_tasks: tasks/base.yml
      tags: [base]

    - name: Docker engine
      ansible.builtin.import_tasks: tasks/docker.yml
      tags: [docker]

    - name: /srv application layout
      ansible.builtin.import_tasks: tasks/srv-layout.yml
      tags: [srv]

    # Reconciled against the live ruleset on 2026-08-08. Safe to enforce:
    # these tasks only add absent rules, they never flush, so a run cannot
    # take away an access path.
    - name: Firewall
      ansible.builtin.import_tasks: tasks/firewall.yml
      tags: [firewall]

  handlers:
    # NOTE: restarting the daemon stops running containers, because
    # "live-restore" is not set in daemon.json. Harmless today (nothing is
    # running); revisit once real services exist.
    - name: Restart docker
      ansible.builtin.systemd_service:
        name: docker
        state: restarted
