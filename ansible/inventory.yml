# Connection details are explicit rather than relying on ~/.ssh/config aliases, so this
# works unchanged from any machine holding the key.

all:
  hosts:
    homelab:
      # Mesh path (NetBird). Works from anywhere the peer is enrolled.
      ansible_host: channa-homelab.netbird.cloud

      # LAN path. Also needs the LAN SSH rule in firewall.yml, which is commented out.
      # ansible_host: 192.168.12.204

      ansible_user: connor

      # Key name comes from ansible/.env for portability.
      # Load it before running:
      #   set -a; source .env; set +a
      ansible_ssh_private_key_file: "~/.ssh/{{ lookup('env', 'HOMELAB_SSH_KEY') or undef('HOMELAB_SSH_KEY is unset. Run: set -a; source .env; set +a') }}"

      # Stock sudo, not Ubuntu 26.04's default sudo-rs.
      # See ansible/README.md#timeout-12s-waiting-for-privilege-escalation-prompt.
      ansible_become_exe: /usr/bin/sudo.ws
