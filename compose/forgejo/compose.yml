services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:16
    container_name: forgejo
    restart: unless-stopped
    environment:
      # Must match the ownership of /srv/forgejo/data (see ansible srv_apps).
      USER_UID: "1000"
      USER_GID: "1000"

      FORGEJO__server__DOMAIN: ${FORGEJO_DOMAIN}
      FORGEJO__server__ROOT_URL: http://${FORGEJO_DOMAIN}:3000/
      FORGEJO__server__HTTP_PORT: "3000"

      # SSH_PORT is advertised in clone URLs: it must be the published port, not the internal one.
      FORGEJO__server__SSH_DOMAIN: ${FORGEJO_DOMAIN}
      FORGEJO__server__SSH_LISTEN_PORT: "22"
      FORGEJO__server__SSH_PORT: "2222"

      FORGEJO__database__DB_TYPE: sqlite3

      FORGEJO__service__DISABLE_REGISTRATION: "true"

      FORGEJO__actions__ENABLED: "true"
      # Where a bare `uses: actions/checkout@v4` resolves from; there is no default.
      FORGEJO__actions__DEFAULT_ACTIONS_URL: https://data.forgejo.org
    volumes:
      - forgejo-data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${BIND_IP}:3000:3000"
      - "${BIND_IP}:2222:22"
    networks:
      - forgejo

  runner:
    image: data.forgejo.org/forgejo/runner:13
    container_name: forgejo-runner
    restart: unless-stopped
    # The runner image documents uid/gid 1001 for this compose layout.
    user: "1001:1001"
    depends_on:
      - forgejo
      - dind
    environment:
      # dind, not a mount of the host's docker.sock. See compose/README.md#forgejo-and-forgejo-actions.
      DOCKER_HOST: tcp://dind:2375
    volumes:
      - runner-data:/data
    working_dir: /data
    command: forgejo-runner daemon --config runner-config.yml
    networks:
      - forgejo

  dind:
    image: docker:dind
    container_name: forgejo-runner-dind
    restart: unless-stopped
    privileged: true
    command: dockerd -H tcp://0.0.0.0:2375 --tls=false
    volumes:
      - dind-storage:/var/lib/docker
    networks:
      # Internal network only: 2375 is unauthenticated and must never reach a host interface.
      - forgejo

volumes:
  forgejo-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/forgejo/data

  runner-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/forgejo-runner/data

  # Deliberately not bind-backed: a rebuildable CI image cache belongs on the docker LV, not /srv.
  dind-storage:

networks:
  forgejo:
    name: forgejo
